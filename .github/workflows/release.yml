name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build And Publish Release
    runs-on: macos-15

    env:
      APP_NAME: NeatEditor
      PROJECT_FILE: NeatEditor.xcodeproj
      SCHEME: NeatEditor
      DERIVED_DATA_PATH: build/DerivedData
      EXPORT_DIR: build/release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Prepare Build Variables
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          ASSET_BASENAME="${APP_NAME}-${GITHUB_REF_NAME}-macOS-universal"

          {
            echo "VERSION=${VERSION}"
            echo "ASSET_BASENAME=${ASSET_BASENAME}"
            echo "APP_PATH=${DERIVED_DATA_PATH}/Build/Products/Release/${APP_NAME}.app"
            echo "ZIP_PATH=${EXPORT_DIR}/${ASSET_BASENAME}.zip"
            echo "CHECKSUM_PATH=${EXPORT_DIR}/SHA256SUMS.txt"
          } >> "$GITHUB_ENV"

      - name: Build Release App
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "${PROJECT_FILE}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify Universal Binary
        shell: bash
        run: |
          set -euo pipefail

          BINARY_PATH="${APP_PATH}/Contents/MacOS/${APP_NAME}"
          lipo -info "${BINARY_PATH}"

      - name: Package Release Assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${EXPORT_DIR}"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${ZIP_PATH}"
          shasum -a 256 "${ZIP_PATH}" > "${CHECKSUM_PATH}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.CHECKSUM_PATH }}
          generate_release_notes: true
          fail_on_unmatched_files: true

