name: NeatEditor

options:
  bundleIdPrefix: com.geraltgraham
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

targets:
  NeatEditor:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Sources/NeatEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geraltgraham.NeatEditor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/NeatEditor/App/Info.plist
        SWIFT_VERSION: 6.0
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  NeatEditor:
    build:
      targets:
        NeatEditor: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
